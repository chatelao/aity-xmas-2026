name: Build ESP32-C6 Captive Portal Firmware

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - 'esp32c6-portal/**'
      - '.github/workflows/build-esp32c6-portal.yml'
  pull_request:
    paths:
      - 'esp32c6-portal/**'
      - '.github/workflows/build-esp32c6-portal.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run Host C Unit Tests
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -Iesp32c6-portal/main/include \
            esp32c6-portal/main/src/led_engine.c \
            esp32c6-portal/main/src/audio_engine.c \
            esp32c6-portal/main/src/nvs_manager.c \
            esp32c6-portal/main/src/preset_store.c \
            esp32c6-portal/main/src/dns_server.c \
            esp32c6-portal/main/src/http_server.c \
            esp32c6-portal/main/src/wifi_ap.c \
            esp32c6-portal/test/test_firmware.c \
            -lm -o test_esp32c6_portal
          ./test_esp32c6_portal

      - name: Verify Embedded Web UI & Parity
        run: node esp32c6-portal/test/test_web_ui.mjs

  build-esp32c6:
    needs: host-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build ESP32-C6 Firmware (ESP-IDF v5.3)
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.3.2
          target: esp32c6
          path: esp32c6-portal

      - name: Merge Flash Binary & Convert to UF2
        run: |
          mkdir -p dist
          python3 -m pip install --quiet esptool
          python3 -m esptool --chip esp32c6 merge_bin \
            -o dist/XmasTreePortal_xiao_esp32c6.bin \
            --flash_mode dio --flash_freq 80m --flash_size 4MB \
            0x0 esp32c6-portal/build/bootloader/bootloader.bin \
            0x8000 esp32c6-portal/build/partition_table/partition-table.bin \
            0x10000 esp32c6-portal/build/aity_xmas_tree_portal.bin

          curl -sSL https://raw.githubusercontent.com/microsoft/uf2/master/utils/uf2conv.py -o uf2conv.py
          curl -sSL https://raw.githubusercontent.com/microsoft/uf2/master/utils/uf2families.json -o uf2families.json
          python3 uf2conv.py -c -b 0x0 -f 0x540ddf62 \
            -o dist/XmasTreePortal_xiao_esp32c6.uf2 \
            dist/XmasTreePortal_xiao_esp32c6.bin

      - name: Upload Firmware Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: esp32c6-captive-portal-firmware
          path: dist/*

      - name: Attach Firmware to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
