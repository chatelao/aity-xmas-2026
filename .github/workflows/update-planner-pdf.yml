name: Update Animation Planner PDF

on:
  push:
    branches: [main]
    paths:
      - "circuitpython/tannenbaum_leds.svg"
      - "circuitpython/lib/palettes.svg"
      - "circuitpython/lib/tannenbaum_palettes.py"
      - "circuitpython/generate_planner_pdf.py"
      - ".github/workflows/update-planner-pdf.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-pdf:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install librsvg2-bin
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin

      - name: Regenerate animation_planner_a4.pdf from SVGs
        run: python3 circuitpython/generate_planner_pdf.py

      - name: Commit and push updated PDF if changed
        run: |
          if git diff --quiet circuitpython/animation_planner_a4.pdf; then
            echo "PDF is already up to date."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add circuitpython/animation_planner_a4.pdf
            git commit -m "Regenerate animation_planner_a4.pdf from SVGs [skip ci]"
            git push
          fi
