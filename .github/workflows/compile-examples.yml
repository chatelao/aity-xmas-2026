name: Compile Examples to UF2

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  find-examples:
    runs-on: ubuntu-latest
    outputs:
      examples: ${{ steps.set-examples.outputs.examples }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - id: set-examples
        name: Discover Arduino Example Directories
        run: |
          examples_json=$(find examples -mindepth 1 -maxdepth 1 -type d -exec test -e "{}/{}.ino" \; -print | xargs -I {} basename {} | jq -R -s -c 'split("\n") | map(select(length > 0))')
          if [ -z "$examples_json" ] || [ "$examples_json" = "[]" ]; then
            # Fallback if no sketch dir matched directory name
            examples_json=$(find examples -name "*.ino" -exec dirname {} \; | xargs -I {} basename {} | sort -u | jq -R -s -c 'split("\n") | map(select(length > 0))')
          fi
          echo "examples=${examples_json}" >> $GITHUB_OUTPUT

  compile:
    needs: find-examples
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        example: ${{ fromJson(needs.find-examples.outputs.examples) }}
        board:
          - name: xiao_rp2040
            fqbn: rp2040:rp2040:seeed_xiao_rp2040
            core_url: https://github.com/earlephilhower/arduino-pico/releases/download/global/package_rp2040_index.json
            core_package: rp2040:rp2040
            family_id: "0xe48bff56"
          - name: xiao_esp32c6
            fqbn: esp32:esp32:XIAO_ESP32C6
            core_url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
            core_package: esp32:esp32@4.0.0
            family_id: "0x540ddf62"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install uf2conv
        run: |
          curl -sSL https://raw.githubusercontent.com/microsoft/uf2/master/utils/uf2conv.py -o uf2conv.py
          curl -sSL https://raw.githubusercontent.com/microsoft/uf2/master/utils/uf2families.json -o uf2families.json
          chmod +x uf2conv.py

      - name: Install Core and Libraries
        run: |
          arduino-cli config init --overwrite
          arduino-cli config set board_manager.additional_urls ${{ matrix.board.core_url }}
          arduino-cli core update-index
          arduino-cli core install ${{ matrix.board.core_package }}
          arduino-cli lib install FastLED@3.10.10

      - name: Compile Sketch
        run: |
          sketch_path="examples/${{ matrix.example }}"
          output_dir="build_output"
          mkdir -p "$output_dir"

          arduino-cli compile --library . --fqbn ${{ matrix.board.fqbn }} --output-dir "$output_dir" "$sketch_path"

      - name: Convert to UF2
        run: |
          output_dir="build_output"
          target_uf2="${{ matrix.example }}_${{ matrix.board.name }}.uf2"

          # Check if .uf2 was directly generated (e.g., Earle Philhower RP2040 core)
          uf2_generated=$(find "$output_dir" -maxdepth 1 -name "*.uf2" | head -n 1)
          if [ -n "$uf2_generated" ] && [ -f "$uf2_generated" ]; then
            cp "$uf2_generated" "$target_uf2"
          else
            # Prefer merged.bin or main sketch .bin over bootloader/partitions .bin
            bin_file=""
            if [ -f "$output_dir/${{ matrix.example }}.ino.merged.bin" ]; then
              bin_file="$output_dir/${{ matrix.example }}.ino.merged.bin"
            elif [ -f "$output_dir/${{ matrix.example }}.ino.bin" ]; then
              bin_file="$output_dir/${{ matrix.example }}.ino.bin"
            else
              bin_file=$(find "$output_dir" -maxdepth 1 -name "*.bin" ! -name "*bootloader*" ! -name "*partitions*" | head -n 1)
            fi

            if [ -z "$bin_file" ] || [ ! -f "$bin_file" ]; then
              bin_file=$(find "$output_dir" -maxdepth 1 \( -name "*.hex" -o -name "*.elf" \) | head -n 1)
            fi

            if [ -z "$bin_file" ] || [ ! -f "$bin_file" ]; then
              echo "Error: No suitable output binary found in $output_dir"
              ls -la "$output_dir"
              exit 1
            fi

            echo "Converting binary file: $bin_file to UF2..."
            python3 uf2conv.py -c -b 0x0 -f ${{ matrix.board.family_id }} -o "$target_uf2" "$bin_file"
          fi

          mkdir -p dist
          cp "$target_uf2" dist/

      - name: Upload UF2 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: uf2-${{ matrix.example }}-${{ matrix.board.name }}
          path: dist/*.uf2

  release:
    needs: [find-examples, compile]
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: uf2-*
          path: release_assets
          merge-multiple: true

      - name: Stage CircuitPython /lib/ and base firmware assets
        run: |
          mkdir -p release_assets staging_cp/lib
          cp circuitpython/default/lib/neopixel.mpy staging_cp/lib/
          cp circuitpython/lib/tannenbaum_layout.py staging_cp/lib/
          cp circuitpython/lib/tannenbaum_palettes.py staging_cp/lib/

          (cd staging_cp && zip -r ../release_assets/circuitpython-lib.zip lib)

          cp staging_cp/lib/neopixel.mpy release_assets/
          cp staging_cp/lib/tannenbaum_layout.py release_assets/
          cp staging_cp/lib/tannenbaum_palettes.py release_assets/

          cp circuitpython/adafruit-circuitpython-seeeduino_xiao_rp2040-*.uf2 release_assets/
          cp circuitpython/adafruit-circuitpython-seeed_xiao_esp32c6-*.bin release_assets/

          cp cutout_patterns/tree_cutout_a4_*.pdf release_assets/
          (cd cutout_patterns && zip -r ../release_assets/cutout_patterns_svg.zip svg)
          for size in 40cm 85cm 105cm; do
            pkg_dir="pkg_${size}"
            mkdir -p "${pkg_dir}"
            cp "cutout_patterns/tree_cutout_a4_${size}.pdf" "${pkg_dir}/"
            cp cutout_patterns/laser_stencils/${size}/*.svg "${pkg_dir}/"
            cp cutout_patterns/README.md "${pkg_dir}/TUTORIAL.md"
            cp LICENSE "${pkg_dir}/"
            (cd "${pkg_dir}" && zip -r "../release_assets/aity-xmas-tree-2026_${size}.zip" .)
          done

          # 10 cm PCB Packaging Concept & 1:1 SVG Templates (.zip)
          mkdir -p pkg_packaging/templates
          cp packaging/README.md packaging/KONZEPT.md packaging/VARIANTEN.md packaging/generate_packaging_templates.py pkg_packaging/
          cp packaging/templates/*.svg pkg_packaging/templates/
          cp LICENSE pkg_packaging/
          (cd pkg_packaging && zip -r ../release_assets/packaging_10cm.zip .)

          # Platform software packages (.zip)
          mkdir -p pkg_rp2040/circuitpython/lib pkg_esp32c6/circuitpython/lib pkg_cp/lib pkg_cp/examples
          cp circuitpython/code.unified.py pkg_rp2040/circuitpython/code.py
          cp circuitpython/code.*.py pkg_rp2040/circuitpython/
          cp circuitpython/default/code.py pkg_rp2040/circuitpython/code.default-diag.py
          cp staging_cp/lib/* pkg_rp2040/circuitpython/lib/
          cp circuitpython/adafruit-circuitpython-seeeduino_xiao_rp2040-*.uf2 pkg_rp2040/
          cp release_assets/*_xiao_rp2040.uf2 pkg_rp2040/ || true
          cp HOWTO_RP2040.md LICENSE pkg_rp2040/
          (cd pkg_rp2040 && zip -r ../release_assets/software_xiao_rp2040.zip .)

          cp circuitpython/code.unified.py pkg_esp32c6/circuitpython/code.py
          cp circuitpython/code.*.py pkg_esp32c6/circuitpython/
          cp circuitpython/default/code.py pkg_esp32c6/circuitpython/code.default-diag.py
          cp circuitpython/web_ui.html.gz pkg_esp32c6/circuitpython/
          cp staging_cp/lib/* pkg_esp32c6/circuitpython/lib/
          cp circuitpython/adafruit-circuitpython-seeed_xiao_esp32c6-*.bin pkg_esp32c6/
          cp release_assets/*_xiao_esp32c6.uf2 pkg_esp32c6/ || true
          cp HOWTO_ESP32-C6.md LICENSE pkg_esp32c6/
          (cd pkg_esp32c6 && zip -r ../release_assets/software_xiao_esp32c6.zip .)

          cp circuitpython/code.unified.py pkg_cp/code.py
          cp circuitpython/code.*.py pkg_cp/examples/
          cp circuitpython/default/code.py pkg_cp/examples/code.default-diag.py
          cp circuitpython/web_ui.html.gz pkg_cp/
          cp staging_cp/lib/* pkg_cp/lib/
          cp circuitpython/adafruit-circuitpython-seeeduino_xiao_rp2040-*.uf2 pkg_cp/
          cp circuitpython/adafruit-circuitpython-seeed_xiao_esp32c6-*.bin pkg_cp/
          cp circuitpython/animation_planner_a4.pdf circuitpython/cheatsheet_a4.pdf circuitpython/cheatsheet_colors_a4.pdf circuitpython/README.md LICENSE pkg_cp/
          cp circuitpython/cheatsheet_a4.pdf circuitpython/cheatsheet_colors_a4.pdf release_assets/
          (cd pkg_cp && zip -r ../release_assets/software_circuitpython.zip .)

          # RP2040 Tester package (.zip)
          mkdir -p pkg_rp2040_tester/lib
          cp circuitpython/code.test.py pkg_rp2040_tester/code.py
          cp circuitpython/default/lib/neopixel.mpy pkg_rp2040_tester/lib/
          cp circuitpython/adafruit-circuitpython-seeeduino_xiao_rp2040-*.uf2 pkg_rp2040_tester/
          (cd pkg_rp2040_tester && zip -r ../release_assets/rp2040-tester.zip .)

      - name: Upload Release Assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release_assets/*
