    .label { font-family: sans-serif; font-size: 3.1px; fill: #333333; }
    .label-sm { font-family: sans-serif; font-size: 2.3px; fill: #555555; }
    .title { font-family: sans-serif; font-size: 4.3px; font-weight: bold; fill: #1b4332; }
  </style>

  <text x="10.00" y="8" class="title">Klemm-Standfuß &amp; Sternhals-Aufhängeclip (1:1, geprüft)</text>
  <text x="10.00" y="12.5" class="label-sm">1,75 mm FR4-Klemmschlitze halten den konischen Stamm (14→18,2 mm) spielfrei • Inkl. Sternclip (9,9 mm Hals)</text>
